<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Wandering Spoon 漫游勺</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&family=Pacifico&family=Fredoka:wght@300..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://esm.sh/react-image-crop@11.0.7/dist/ReactCrop.css" />
  <script type="module" src="/index.tsx"></script>
  <style>
    body {
      font-family: 'Lato', sans-serif;
      background-color: #FDF9F0;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Playfair Display', serif;
      color: #4A2C1D;
    }

    .font-pacifico {
      font-family: 'Pacifico', cursive;
    }

    .font-fredoka {
      font-family: 'Fredoka', sans-serif;
    }

    .font-merriweather {
      font-family: 'Merriweather', serif;
    }

    .font-georgia {
      font-family: 'Georgia', serif;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #4A2C1D33;
      border-radius: 10px;
    }

    @keyframes pulse-once {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    .animate-pulse-once {
      animation: pulse-once 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Enhanced React Crop Customization */
    .ReactCrop__crop-selection {
      border: 2px dashed #E44C2A !important;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5) !important;
    }

    .ReactCrop__handle {
      width: 18px !important;
      height: 18px !important;
      background-color: #E44C2A !important;
      border: 3px solid #fff !important;
      border-radius: 4px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
      opacity: 1 !important;
    }

    /* Making the corners extra prominent */
    .ReactCrop__handle.ord-nw,
    .ReactCrop__handle.ord-ne,
    .ReactCrop__handle.ord-sw,
    .ReactCrop__handle.ord-se {
      width: 22px !important;
      height: 22px !important;
      z-index: 10;
    }

    /* Hide side handles to guide users towards corners as requested */
    .ReactCrop__handle.ord-n,
    .ReactCrop__handle.ord-e,
    .ReactCrop__handle.ord-s,
    .ReactCrop__handle.ord-w {
      display: none !important;
    }
  </style>
</head>

<body class="text-stone-800 antialiased">
  <div id="root"></div>
</body>

</html>
